<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title> ｽﾋﾟｷ 回し</title>
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100svh;
    background: #090914;
    color: #f7f3ff;
    font-family: system-ui, sans-serif;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  main {
    position: relative;
    width: min(740px, 100%);
    min-height: 100svh;
    margin: auto;
    padding: 32px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  h1 { margin: 0; font-size: clamp(28px, 6vw, 44px); }
  p { margin: 0; color: #bcb7d2; text-align: center; line-height: 1.6; }
  .stage {
    width: 100%;
    height: clamp(280px, 48svh, 460px);
    display: grid;
    place-items: center;
    perspective: 900px;
    position: relative;
  }
  .stage::before {
    content: "";
    position: absolute;
    bottom: 10%;
    width: 65%;
    height: 15%;
    border-radius: 50%;
    background: #a145ff25;
    filter: blur(24px);
  }
  #spinner {
    width: min(70vw, 310px);
    height: min(70vw, 310px);
    display: grid;
    place-items: center;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    will-change: transform;
    outline-offset: 12px;
  }
  #spinner.dragging { cursor: grabbing; }
  #character {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    pointer-events: none;
    filter: drop-shadow(0 12px 24px #0008);
  }
  #placeholder {
    padding: 32px;
    border: 2px dashed #847397;
    border-radius: 24px;
    color: #d9caeb;
    text-align: center;
    line-height: 1.8;
  }
  [hidden] { display: none !important; }
  .meter {
    width: min(340px, 100%);
    height: 6px;
    background: #ffffff18;
    border-radius: 9px;
    overflow: hidden;
  }
  #power {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #7af5ed, #cb7bff, #ff7bc1);
  }
  #status { font-variant-numeric: tabular-nums; min-height: 26px; }
  .controls {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  button, .file-button {
    font: inherit;
    font-size: 14px;
    border: 1px solid #ffffff25;
    border-radius: 12px;
    background: #222033;
    color: white;
    padding: 12px 16px;
    cursor: pointer;
  }
  /* 마우스를 사용하는 기기에서만 hover 효과 */
@media (hover: hover) and (pointer: fine) {
  button:hover,
  .file-button:hover {
    background: #36304c;
  }
}

/* 누르고 있는 동안만 색상 변경 */
button:active,
.file-button:active {
  background: #36304c;
}
  .file-button { position: relative; overflow: hidden; }
  .file-button input {
    position: absolute;
    inset: 0;
    opacity: 0;
    width: 100%;
    cursor: pointer;
  }
  .note { font-size: 14px; max-width: 520px; }
  #message { color: #ead2ff; font-size: 14px; }
  html, body {
  touch-action: none;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
}
#spinner,
#spinner:focus,
#spinner:focus-visible {
  outline: none;
}
.file-button {
  display: none;
}
button,
.file-button,
#spinner {
  -webkit-tap-highlight-color: transparent;
}
#lightToggle,
#sound {
  width: 100px;
  padding: 12px 10px;
  flex-shrink: 0;
  white-space: nowrap;
}
#character {
  -webkit-filter: none !important;
  filter: none !important;
}
</style>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#090914">
</head>
<body>
<canvas id="lights" aria-hidden="true"></canvas>
<main>
  <h1>ｽﾋﾟｷ 回し</h1>
  <p>押したまま左右にドラッグして、離してみてください。</p>

  <div class="stage">
    <div id="spinner" tabindex="0" role="button"
         aria-label="스피키 돌리기. 좌우로 드래그하거나 방향키를 누르세요.">
      <img id="character" alt="스피키" draggable="false" hidden>
      <div id="placeholder">사진을 넣으면<br>스피키가 여기 나타나요</div>
    </div>
  </div>

  <p id="status">回す準備完了</p>
  <div class="meter"><div id="power"></div></div>

  <div class="controls">
    <label class="file-button">
      사진 선택
      <input id="imageFile" type="file" accept="image/*" aria-label="사진 선택">
    </label>
    <label class="file-button">
      음성 선택
      <input id="audioFile" type="file" accept="audio/*" aria-label="음성 선택">
    </label>
    <button id="sound" aria-pressed="true">音声 ON</button>
    <button id="lightToggle" aria-pressed="true">ライト ON</button>
    <button id="stop">止める</button>
  </div>

  <p class="note">速く引っ張るほど勢いよく回ります。<br>
    キーボードの ← → でも回転・Spaceで停止
  </p>
  <p id="message" role="status"></p>
</main>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const spinner = $("spinner");
  const character = $("character");
  const canvas = $("lights");
  const ctx = canvas.getContext("2d");

  const MAX_SPEED = 2400;
  const FRICTION = 0.2;
  const DRAG_TURNS = 1;
  const MIN_VOICE_SPEED = 35;

  let angle = 0;
  let velocity = 0;
  let drag = null;
  let soundEnabled = true;
  let lightsEnabled =
    !matchMedia("(prefers-reduced-motion: reduce)").matches;
  let lastFrame = performance.now();
  let width = innerWidth;
  let height = innerHeight;
  let imageURL = null;

  function message(text) {
    $("message").textContent = text;
  }

  // ── 음성 ──
  // 파일 다운로드와 사용자 조작에 의한 오디오 활성화를 분리합니다.
  const AudioContextClass =
    window.AudioContext || window.webkitAudioContext;

  let audioCtx = null;
  let audioBuffer = null;
  let source = null;
  let bytes = null;
  let decodeStarted = false;
  let loadError = null;
  let loadVersion = 0;
  let voicePending = false;
  let voicePlayed = false;
  let requestedRate = 1;
  let diagnosticTimer = null;

  function eligibleForVoice() {
    return (
      soundEnabled &&
      !drag &&
      !document.hidden &&
      Math.abs(velocity) >= MIN_VOICE_SPEED
    );
  }

  function silence() {
    voicePending = false;
    clearTimeout(diagnosticTimer);

    if (source) {
      const old = source;
      source = null;
      old.onended = null;

      try {
        old.stop();
      } catch (_) {
        // 이미 끝난 음성
      }

      old.disconnect();
    }
  }

  function tryStartVoice() {
    if (!voicePending || voicePlayed || !eligibleForVoice()) return;

    if (
      !audioBuffer ||
      !audioCtx ||
      audioCtx.state !== "running"
    ) return;

    const next = audioCtx.createBufferSource();
    next.buffer = audioBuffer;

    // Web Audio에서는 재생 속도를 높이면 음높이도 올라갑니다.
    // 원래 속도와 음높이를 유지하려면 requestedRate 대신 1을 넣으세요.
    next.playbackRate.value = requestedRate;
    next.connect(audioCtx.destination);

    next.onended = () => {
      next.disconnect();
      if (source === next) source = null;
    };

    try {
      next.start();
      source = next;
      voicePending = false;
      voicePlayed = true;
      clearTimeout(diagnosticTimer);
      message("");
    } catch (error) {
      next.disconnect();
      voicePending = false;
      message(`음성 시작 실패: ${error.name}`);
    }
  }

  function decodeVoice() {
    if (!audioCtx || !bytes || decodeStarted || audioBuffer) return;

    decodeStarted = true;
    const version = loadVersion;

    audioCtx.decodeAudioData(bytes.slice(0)).then(buffer => {
      if (version !== loadVersion) return;

      audioBuffer = buffer;
      bytes = null;
      tryStartVoice();
    }).catch(error => {
      if (version !== loadVersion) return;

      loadError = `음성 해독 실패: ${error.name}`;
      message(loadError);
    });
  }

  async function loadVoice(file = null) {
    const version = ++loadVersion;

    silence();
    voicePlayed = false;
    audioBuffer = null;
    bytes = null;
    decodeStarted = false;
    loadError = null;

    try {
      let data;

      if (file) {
        data = await file.arrayBuffer();
      } else {
        const response = await fetch("./voice.mp3");

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        data = await response.arrayBuffer();
      }

      if (version !== loadVersion) return;

      bytes = data;
      decodeVoice();
    } catch (error) {
      if (version !== loadVersion) return;

      loadError = `음성 파일 로딩 실패: ${error.message}`;
      message(loadError);
    }
  }

  // await나 타이머를 거치지 않고 사용자 이벤트에서 직접 호출합니다.
  function activateAudio() {
    if (!soundEnabled) return;

    if (!AudioContextClass) {
      message("이 브라우저는 Web Audio를 지원하지 않습니다.");
      return;
    }

    try {
      if (!audioCtx) {
        audioCtx = new AudioContextClass();
        audioCtx.addEventListener("statechange", tryStartVoice);
      }

      if (audioCtx.state !== "running") {
        audioCtx.resume().then(tryStartVoice).catch(error => {
          if (voicePending) {
            message(`음성 활성화 실패: ${error.name}`);
          }
        });
      }

      decodeVoice();
      tryStartVoice();
    } catch (error) {
      message(`음성 초기화 실패: ${error.name}`);
    }
  }

  function playVoice() {
    if (!eligibleForVoice() || voicePlayed || voicePending) return;

    voicePending = true;
    requestedRate = Math.min(
      1.5,
      0.95 + Math.abs(velocity) / 4500
    );

    activateAudio();
    tryStartVoice();

    if (!voicePending) return;

    message(loadError || "음성을 준비하고 있어요…");

    clearTimeout(diagnosticTimer);
    diagnosticTimer = setTimeout(() => {
      if (!voicePending) return;

      if (loadError) {
        message(loadError);
      } else if (audioCtx && audioCtx.state !== "running") {
        message(
          `음성 활성화 대기 (${audioCtx.state}). 화면을 한 번 탭해 주세요.`
        );
      } else if (!audioBuffer) {
        message("음성 파일을 불러오는 중입니다…");
      }
    }, 2000);
  }

  // 터치 이벤트는 오디오 활성화만 담당합니다.
  // 드래그 종료 상태는 pointerup에서만 처리합니다.
  for (const type of ["touchstart", "touchend", "click"]) {
    document.addEventListener(type, activateAudio, {
      capture: true,
      passive: true
    });
  }

  loadVoice();

  // ── 이미지와 파일 선택 ──
  character.onload = () => {
    character.hidden = false;
    $("placeholder").hidden = true;
  };

  character.onerror = () => {
    character.hidden = true;
    $("placeholder").hidden = false;
    message("스피키 사진을 선택해 주세요.");
  };

  character.src = "./spiki.png";

  $("imageFile").onchange = event => {
    const file = event.target.files[0];
    if (!file) return;

    if (!file.type.startsWith("image/")) {
      message("이미지 파일을 선택해 주세요.");
      return;
    }

    stop();

    if (imageURL) URL.revokeObjectURL(imageURL);

    imageURL = URL.createObjectURL(file);
    character.src = imageURL;
    message("사진을 적용했어요.");
  };

  $("audioFile").onchange = event => {
    const file = event.target.files[0];
    if (!file) return;

    activateAudio();
    loadVoice(file);
    message("음성을 선택했어요. 다시 돌리면 재생돼요.");
  };

  // ── 버튼 ──
  function updateLightButton() {
    $("lightToggle").textContent =
      lightsEnabled ? "ライト ON" : "ライト OFF";

    $("lightToggle").setAttribute(
      "aria-pressed",
      String(lightsEnabled)
    );
  }

  updateLightButton();

  $("sound").onclick = () => {
    soundEnabled = !soundEnabled;

    $("sound").textContent =
      soundEnabled ? "音声 ON" : "音声 OFF";

    $("sound").setAttribute(
      "aria-pressed",
      String(soundEnabled)
    );

    if (!soundEnabled) {
      silence();
    } else {
      voicePlayed = false;
      activateAudio();
      playVoice();
    }
  };

  $("lightToggle").onclick = () => {
    lightsEnabled = !lightsEnabled;
    updateLightButton();
  };

  // ── 드래그와 회전 ──
  function endDrag() {
    const pointerId = drag ? drag.id : null;

    // 캡처 해제보다 먼저 초기화해야 회전이 멈추지 않습니다.
    drag = null;
    spinner.classList.remove("dragging");

    if (
      pointerId !== null &&
      spinner.hasPointerCapture(pointerId)
    ) {
      spinner.releasePointerCapture(pointerId);
    }
  }

  function stop() {
    endDrag();
    velocity = 0;
    angle = 0;
    silence();
    voicePlayed = false;
  }

  $("stop").onclick = stop;

  function moveWithPointer(event) {
    if (!drag || event.pointerId !== drag.id) return;

    const now = performance.now();
    const dx = event.clientX - drag.lastX;

    if (dx === 0) return;

    const dt = Math.max(
      (now - drag.lastTime) / 1000,
      0.001
    );

    const deltaAngle =
      dx * 360 * DRAG_TURNS / innerWidth;

    const handSpeed = Math.abs(deltaAngle) / dt;

    const addedSpeed =
      deltaAngle * (1.5 + Math.min(2, handSpeed / 720));

    velocity = Math.max(
      -MAX_SPEED,
      Math.min(MAX_SPEED, velocity + addedSpeed)
    );

    drag.lastX = event.clientX;
    drag.lastTime = now;
  }

  document.addEventListener("pointerdown", event => {
    if (event.target.closest(
      "button, input, label, a, select, textarea"
    )) return;

    if (drag || !event.isPrimary || event.button !== 0) return;

    event.preventDefault();
    spinner.focus({ preventScroll: true });

    silence();
    voicePlayed = false;

    drag = {
      id: event.pointerId,
      lastX: event.clientX,
      lastTime: performance.now()
    };

    activateAudio();

    spinner.setPointerCapture(event.pointerId);
    spinner.classList.add("dragging");
  }, { passive: false });

  spinner.addEventListener("pointermove", moveWithPointer);

  spinner.addEventListener("pointerup", event => {
    if (!drag || event.pointerId !== drag.id) return;

    moveWithPointer(event);
    endDrag();

    if (Math.abs(velocity) < 5) velocity = 0;

    playVoice();
  });

  function cancelDrag() {
    if (drag) stop();
  }

  spinner.addEventListener("pointercancel", cancelDrag);
  spinner.addEventListener("lostpointercapture", cancelDrag);
  window.addEventListener("blur", stop);

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stop();
  });

  spinner.addEventListener("keydown", event => {
    if (!["ArrowLeft", "ArrowRight", " "].includes(event.key)) return;

    event.preventDefault();

    if (event.key === " ") {
      stop();
      return;
    }

    if (drag) return;

    const direction = event.key === "ArrowLeft" ? -1 : 1;

    velocity = Math.max(
      -MAX_SPEED,
      Math.min(MAX_SPEED, velocity + direction * 550)
    );

    if (!event.repeat) {
      silence();
      voicePlayed = false;
      activateAudio();
      playVoice();
    }
  });

  // ── 화면 크기 ──
  function resize() {
    width = innerWidth;
    height = innerHeight;

    const dpr = Math.min(devicePixelRatio || 1, 2);

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);

    if (ctx) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }

  window.addEventListener("resize", resize);
  resize();

  // ── 조명 ──
  function drawLights(now) {
    if (!ctx) return;

    ctx.clearRect(0, 0, width, height);

    const intensity = Math.min(
      Math.abs(velocity) / 850,
      1
    );

    if (!lightsEnabled || intensity < 0.01) {
      character.style.filter = "drop-shadow(0 12px 24px #0008)";
      return;
    }

    const rotation = angle * Math.PI / 180;
    const rect = spinner.parentElement.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const hue = ((angle % 360) + 360) % 360;
    const glow = intensity * (0.9 + 0.1 * Math.sin(now / 1100));

    character.style.filter = `
      brightness(${1 + glow * 0.65})
      saturate(${1 + glow * 0.9})
      drop-shadow(0 0 ${6 + glow * 8}px
        hsla(${hue}, 100%, 80%, ${glow * 0.95}))
      drop-shadow(0 0 ${18 + glow * 22}px
        hsla(${hue}, 100%, 65%, ${glow * 0.85}))
      drop-shadow(0 0 ${35 + glow * 35}px
        hsla(${(hue + 100) % 360}, 100%, 60%, ${glow * 0.65}))
    `;

    function wash(x, y, rx, ry, color, opacity) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(rx, ry);

      const gradient =
        ctx.createRadialGradient(0, 0, 0, 0, 0, 1);

      gradient.addColorStop(
        0,
        `hsla(${color}, 95%, 72%, ${opacity})`
      );
      gradient.addColorStop(
        0.35,
        `hsla(${color}, 95%, 64%, ${opacity * 0.65})`
      );
      gradient.addColorStop(
        0.7,
        `hsla(${color}, 95%, 58%, ${opacity * 0.2})`
      );
      gradient.addColorStop(
        1,
        `hsla(${color}, 95%, 55%, 0)`
      );

      ctx.fillStyle = gradient;
      ctx.fillRect(-1, -1, 2, 2);
      ctx.restore();
    }

    ctx.save();
    ctx.globalCompositeOperation = "screen";

    wash(
      cx,
      cy,
      Math.min(width * 0.65, 580),
      Math.min(height * 0.55, 440),
      hue,
      glow * 0.13
    );

    const reach = Math.min(width * 0.48, 460);

    for (let i = 0; i < 5; i++) {
      const phase = rotation + i * Math.PI * 2 / 5;
      const depth = Math.cos(phase);
      const front = (depth + 1) / 2;
      const perspective = 0.75 + front * 0.5;
      const color = (hue + i * 32) % 360;

      const targetX =
        cx + Math.sin(phase) * reach * perspective;
      const targetY =
        cy + depth * Math.min(height * 0.2, 150);

      const spread =
        Math.min(width * 0.24, 190) * perspective;
      const brightness =
        glow * (0.07 + front * 0.08);

      for (let j = 0; j < 12; j++) {
        const t = j / 11;
        const radius = spread * (0.38 + t * 0.85);

        wash(
          cx + (targetX - cx) * t,
          cy + (targetY - cy) * t,
          radius,
          radius * 0.85,
          color,
          brightness * Math.sin(Math.PI * t) * 0.32
        );
      }

      wash(
        targetX,
        targetY,
        spread * 1.5,
        spread * 0.85,
        color,
        brightness * 0.65
      );
    }

    ctx.restore();
  }

  // ── 애니메이션 ──
  function frame(now) {
    const dt = Math.min(
      (now - lastFrame) / 1000,
      0.05
    );

    lastFrame = now;

    const decay = Math.exp(-FRICTION * dt);

    angle += velocity * (1 - decay) / FRICTION;
    velocity *= decay;

    if (Math.abs(velocity) < 5) velocity = 0;

    angle %= 360;

    spinner.style.transform = `rotateY(${angle}deg)`;

    $("power").style.width =
      `${Math.abs(velocity) / MAX_SPEED * 100}%`;

    $("status").textContent = drag
      ? "離すとくるくる!"
      : velocity
        ? `${velocity > 0 ? "右" : "左"}へ · ${
            Math.round(Math.abs(velocity) / 6)
          } RPM`
        : "回す準備完了";

    // 실제 재생 중이거나 대기 중인 음성이 있을 때만 취소합니다.
    if (
      Math.abs(velocity) < MIN_VOICE_SPEED &&
      (source || voicePending)
    ) {
      silence();
    }

    drawLights(now);
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
