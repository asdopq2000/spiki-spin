<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title> ｽﾋﾟｷ 回し</title>
<style>
* { box-sizing: border-box; }
:root { color-scheme: dark; }
body { margin: 0; min-height: 100svh; background: #090914; color: #f7f3ff; font-family: system-ui, sans-serif; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
main { position: relative; width: min(740px,100%); min-height: 100svh; margin: auto; padding: 32px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
h1 { margin: 0; font-size: clamp(28px,6vw,44px); }
p { margin: 0; color: #bcb7d2; text-align: center; line-height: 1.6; }
.stage { width: 100%; height: clamp(280px,48svh,460px); display: grid; place-items: center; perspective: 900px; position: relative; }
.stage::before { content: ""; position: absolute; bottom: 10%; width: 65%; height: 15%; border-radius: 50%; background: #a145ff25; filter: blur(24px); }
#spinner { width: min(70vw,310px); height: min(70vw,310px); display: grid; place-items: center; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; will-change: transform; }
#spinner.dragging { cursor: grabbing; }
#character { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; -webkit-filter: none !important; filter: none !important; }
#placeholder { padding: 32px; border: 2px dashed #847397; border-radius: 24px; color: #d9caeb; text-align: center; line-height: 1.8; }
[hidden] { display: none !important; }
.meter { width: min(340px,100%); height: 6px; background: #ffffff18; border-radius: 9px; overflow: hidden; }
#power { height: 100%; width: 0; background: linear-gradient(90deg,#7af5ed,#cb7bff,#ff7bc1); }
#status { font-variant-numeric: tabular-nums; min-height: 26px; }
.controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
button,.file-button { font: inherit; font-size: 14px; border: 1px solid #ffffff25; border-radius: 12px; background: #222033; color: white; padding: 12px 16px; cursor: pointer; }
@media (hover:hover) and (pointer:fine) { button:hover,.file-button:hover { background: #36304c; } }
button:active,.file-button:active { background: #36304c; }
.file-button { position: relative; overflow: hidden; display: none; }
.file-button input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
.note { font-size: 14px; max-width: 520px; }
#message { color: #ead2ff; font-size: 14px; }
html,body { touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
#spinner,#spinner:focus,#spinner:focus-visible { outline: none; }
button,.file-button,#spinner { -webkit-tap-highlight-color: transparent; }
#lightToggle,#sound { width: 100px; padding: 12px 10px; flex-shrink: 0; white-space: nowrap; }
</style>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#090914">
</head>
<body>
<canvas id="lights" aria-hidden="true"></canvas>
<main>
<h1>ｽﾋﾟｷ 回し</h1>
<p>押したまま左右にドラッグして、離してみてください。</p>
<div class="stage"><div id="spinner" tabindex="0" role="button" aria-label="스피키 돌리기. 좌우로 드래그하거나 방향키를 누르세요.">
<img id="character" alt="스피키" draggable="false" hidden>
<div id="placeholder">사진을 넣으면<br>스피키가 여기 나타나요</div>
</div></div>
<p id="status">回す準備完了</p>
<div class="meter"><div id="power"></div></div>
<div class="controls">
<label class="file-button">사진 선택<input id="imageFile" type="file" accept="image/*" aria-label="사진 선택"></label>
<label class="file-button">음성 선택<input id="audioFile" type="file" accept="audio/*" aria-label="음성 선택"></label>
<button id="sound" aria-pressed="true">音声 ON</button>
<button id="lightToggle" aria-pressed="true">ライト ON</button>
<button id="stop">止める</button>
</div>
<p class="note">速く引っ張るほど勢いよく回ります。<br>キーボードの ← → でも回転・Spaceで停止</p>
<p id="message" role="status"></p>
</main>
<script>
const $ = id => document.getElementById(id);
const spinner = $("spinner"), character = $("character");
const canvas = $("lights"), ctx = canvas.getContext("2d");
const MAX_SPEED = 2400, FRICTION = 0.2, DRAG_TURNS = 1;
let angle = 0, velocity = 0, drag = null;
let soundEnabled = true;
let lightsEnabled = !matchMedia("(prefers-reduced-motion: reduce)").matches;
let lastFrame = performance.now();
let imageURL = null, audioURL = null;
let width = innerWidth, height = innerHeight;
function message(text) { $("message").textContent = text; }

// HTMLAudioElement performs pitch-preserving rate changes.
// Web Audio is used ONLY as a silent output gate while the finger is down.
const voice = new Audio();
voice.preload = "auto";
voice.loop = false;
voice.preservesPitch = true;
if ("webkitPreservesPitch" in voice) voice.webkitPreservesPitch = true;
voice.src = "./voice.mp3";
let audioContext = null, mediaSource = null, outputGain = null;
let soundGeneration = 0, voicePlayed = false, audioBusy = false;

function ensureAudioGraph() {
  if (audioContext) return;
  const Context = window.AudioContext || window.webkitAudioContext;
  if (!Context) throw new Error("Web Audio is unavailable");
  audioContext = new Context();
  outputGain = audioContext.createGain();
  outputGain.gain.value = 0;
  mediaSource = audioContext.createMediaElementSource(voice);
  mediaSource.connect(outputGain);
  outputGain.connect(audioContext.destination);
}
function gate(value) {
  if (outputGain) outputGain.gain.value = value;
}
function silence() {
  soundGeneration++;
  gate(0);
  voice.pause();
  audioBusy = false;
}
function reportAudioError(error, generation) {
  if (generation !== soundGeneration || error.name === "AbortError") return;
  gate(0);
  voice.pause();
  audioBusy = false;
  voicePlayed = false;
  message(`音声エラー: ${error.name || "Error"}`);
  console.error("Audio playback:", error);
}
// Must be called synchronously from the real start/end/key/click event.
// Never wait for canplay, fetch, or resume before calling voice.play().
function requestAudio(audible) {
  const generation = ++soundGeneration;
  gate(0);
  try {
    ensureAudioGraph();
    gate(0);
    voice.preservesPitch = true;
    if ("webkitPreservesPitch" in voice) voice.webkitPreservesPitch = true;
    voice.playbackRate = audible
      ? Math.min(1.5, 0.95 + Math.abs(velocity) / 4500)
      : 1;
    try { voice.currentTime = 0; } catch {}
    const resumed = audioContext.state === "running"
      ? Promise.resolve() : audioContext.resume();
    const playing = voice.play();
    audioBusy = true;
    Promise.all([resumed, playing]).then(() => {
      if (generation !== soundGeneration) return;
      if (!soundEnabled || document.hidden) { silence(); return; }
      if (audible && !drag && Math.abs(velocity) >= 35) {
        gate(1);
        message("");
      }
      // Priming remains silent until release; it can end naturally.
    }).catch(error => reportAudioError(error, generation));
  } catch (error) { reportAudioError(error, generation); }
}
function primeVoice() {
  if (soundEnabled) requestAudio(false);
}
function playVoice() {
  if (!soundEnabled || drag || Math.abs(velocity) < 35 || voicePlayed) return;
  voicePlayed = true;
  requestAudio(true);
}
voice.addEventListener("ended", () => { gate(0); audioBusy = false; });

character.onload = () => { character.hidden = false; $("placeholder").hidden = true; };
character.onerror = () => { character.hidden = true; $("placeholder").hidden = false; message("스피키 사진을 선택해 주세요."); };
character.src = "./spiki.png";
$("imageFile").onchange = event => {
  const file = event.target.files[0];
  if (!file) return;
  if (!file.type.startsWith("image/")) { message("이미지 파일을 선택해 주세요."); return; }
  stop();
  if (imageURL) URL.revokeObjectURL(imageURL);
  imageURL = URL.createObjectURL(file);
  character.src = imageURL;
  message("사진을 적용했어요.");
};
$("audioFile").onchange = event => {
  const file = event.target.files[0];
  if (!file) return;
  silence();
  if (audioURL) URL.revokeObjectURL(audioURL);
  audioURL = URL.createObjectURL(file);
  voice.src = audioURL;
  voice.load();
  voicePlayed = false;
  message("음성을 선택했어요. 다시 돌리면 재생돼요.");
};
function updateLightButton() {
  $("lightToggle").textContent = lightsEnabled ? "ライト ON" : "ライト OFF";
  $("lightToggle").setAttribute("aria-pressed", String(lightsEnabled));
}
updateLightButton();
$("sound").onclick = () => {
  soundEnabled = !soundEnabled;
  $("sound").textContent = soundEnabled ? "音声 ON" : "音声 OFF";
  $("sound").setAttribute("aria-pressed", String(soundEnabled));
  if (!soundEnabled) silence();
  else {
    voicePlayed = false;
    if (!drag && Math.abs(velocity) >= 35) playVoice();
    else primeVoice();
  }
};
$("lightToggle").onclick = () => { lightsEnabled = !lightsEnabled; updateLightButton(); };

function clearDrag() {
  const previous = drag;
  drag = null;
  spinner.classList.remove("dragging");
  if (previous?.kind === "pointer" && spinner.hasPointerCapture(previous.id)) {
    spinner.releasePointerCapture(previous.id);
  }
}
function stop() {
  clearDrag();
  velocity = 0; angle = 0;
  spinner.style.transform = "rotateY(0deg)";
  silence();
  voicePlayed = false;
}
$("stop").onclick = stop;
function isControl(target) {
  return target instanceof Element && target.closest("button, input, label, a, select, textarea");
}
function beginDrag(kind, id, x) {
  silence();
  voicePlayed = false;
  drag = { kind, id, lastX: x, lastTime: performance.now() };
  spinner.classList.add("dragging");
  // Native touchstart is used on touchscreens, before any asynchronous work.
  primeVoice();
  spinner.focus({ preventScroll: true });
}
function moveDrag(x) {
  if (!drag) return;
  const now = performance.now(), dx = x - drag.lastX;
  if (dx === 0) return;
  const dt = Math.max((now - drag.lastTime) / 1000, 0.001);
  const deltaAngle = dx * 360 * DRAG_TURNS / innerWidth;
  const handSpeed = Math.abs(deltaAngle) / dt;
  const addedSpeed = deltaAngle * (1.5 + Math.min(2, handSpeed / 720));
  velocity = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, velocity + addedSpeed));
  drag.lastX = x; drag.lastTime = now;
}
function endDrag(x) {
  moveDrag(x);
  clearDrag();
  if (Math.abs(velocity) < 5) velocity = 0;
  if (Math.abs(velocity) >= 35) playVoice();
  else silence();
}

// Touch gets its own native event path. No synthetic click or extra tap required.
const nativeTouch = "ontouchstart" in window;
document.addEventListener("touchstart", event => {
  if (drag || event.touches.length !== 1 || isControl(event.target)) return;
  const touch = event.changedTouches[0];
  beginDrag("touch", touch.identifier, touch.clientX);
}, { passive: true });
document.addEventListener("touchmove", event => {
  if (drag?.kind !== "touch") return;
  const touch = Array.from(event.changedTouches).find(t => t.identifier === drag.id);
  if (touch) moveDrag(touch.clientX);
}, { passive: true });
document.addEventListener("touchend", event => {
  if (drag?.kind !== "touch") return;
  const touch = Array.from(event.changedTouches).find(t => t.identifier === drag.id);
  if (touch) endDrag(touch.clientX);
}, { passive: true });
document.addEventListener("touchcancel", event => {
  if (drag?.kind === "touch" && Array.from(event.changedTouches).some(t => t.identifier === drag.id)) stop();
}, { passive: true });

// Mouse / pen use pointer capture. Touch pointer events must not start a second drag.
document.addEventListener("pointerdown", event => {
  if (nativeTouch && event.pointerType === "touch") return;
  if (drag || !event.isPrimary || event.button !== 0 || isControl(event.target)) return;
  if (event.pointerType === "mouse") event.preventDefault();
  beginDrag("pointer", event.pointerId, event.clientX);
  spinner.setPointerCapture(event.pointerId);
}, { passive: false });
spinner.addEventListener("pointermove", event => {
  if (drag?.kind === "pointer" && event.pointerId === drag.id) moveDrag(event.clientX);
});
spinner.addEventListener("pointerup", event => {
  if (drag?.kind === "pointer" && event.pointerId === drag.id) endDrag(event.clientX);
});
function cancelPointer(event) {
  if (drag?.kind === "pointer" && event.pointerId === drag.id) stop();
}
spinner.addEventListener("pointercancel", cancelPointer);
spinner.addEventListener("lostpointercapture", cancelPointer);
window.addEventListener("blur", stop);
document.addEventListener("visibilitychange", () => { if (document.hidden) stop(); });
spinner.addEventListener("keydown", event => {
  if (!["ArrowLeft", "ArrowRight", " "].includes(event.key)) return;
  event.preventDefault();
  if (event.key === " ") { stop(); return; }
  if (drag) return;
  const direction = event.key === "ArrowLeft" ? -1 : 1;
  velocity = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, velocity + direction * 550));
  if (!event.repeat) { silence(); voicePlayed = false; playVoice(); }
});
function resize() {
  width = innerWidth; height = innerHeight;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();
function drawLights(now) {
  ctx.clearRect(0, 0, width, height);
  const intensity = Math.min(Math.abs(velocity) / 850, 1);
  if (!lightsEnabled || intensity < 0.01) return;
  const rotation = angle * Math.PI / 180;
  const rect = spinner.parentElement.getBoundingClientRect();
  const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
  const hue = ((angle % 360) + 360) % 360;
  const glow = intensity * (0.9 + 0.1 * Math.sin(now / 1100));
  function wash(x, y, rx, ry, color, opacity) {
    ctx.save(); ctx.translate(x, y); ctx.scale(rx, ry);
    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    gradient.addColorStop(0, `hsla(${color},95%,72%,${opacity})`);
    gradient.addColorStop(0.35, `hsla(${color},95%,64%,${opacity * 0.65})`);
    gradient.addColorStop(0.7, `hsla(${color},95%,58%,${opacity * 0.2})`);
    gradient.addColorStop(1, `hsla(${color},95%,55%,0)`);
    ctx.fillStyle = gradient; ctx.fillRect(-1, -1, 2, 2); ctx.restore();
  }
  ctx.save(); ctx.globalCompositeOperation = "screen";
  wash(cx, cy, Math.min(width * 0.65,580), Math.min(height * 0.55,440), hue, glow * 0.13);
  const reach = Math.min(width * 0.48,460);
  for (let i = 0; i < 5; i++) {
    const phase = rotation + i * Math.PI * 2 / 5;
    const depth = Math.cos(phase), front = (depth + 1) / 2;
    const perspective = 0.75 + front * 0.5, color = (hue + i * 32) % 360;
    const targetX = cx + Math.sin(phase) * reach * perspective;
    const targetY = cy + depth * Math.min(height * 0.2,150);
    const spread = Math.min(width * 0.24,190) * perspective;
    const brightness = glow * (0.07 + front * 0.08);
    for (let j = 0; j < 12; j++) {
      const t = j / 11, radius = spread * (0.38 + t * 0.85);
      wash(cx + (targetX-cx)*t, cy + (targetY-cy)*t, radius, radius*0.85, color, brightness*Math.sin(Math.PI*t)*0.32);
    }
    wash(targetX,targetY,spread*1.5,spread*0.85,color,brightness*0.65);
  }
  ctx.restore();
}
function frame(now) {
  const dt = Math.min((now - lastFrame) / 1000,0.05); lastFrame = now;
  const decay = Math.exp(-FRICTION * dt);
  angle += velocity * (1-decay) / FRICTION; velocity *= decay;
  if (Math.abs(velocity) < 5) velocity = 0;
  angle %= 360;
  spinner.style.transform = `rotateY(${angle}deg)`;
  $("power").style.width = `${Math.abs(velocity)/MAX_SPEED*100}%`;
  $("status").textContent = drag ? "離すとくるくる!" : velocity
    ? `${velocity > 0 ? "右" : "左"}へ · ${Math.round(Math.abs(velocity)/6)} RPM` : "回す準備完了";
  // Do not cancel the silent preparation while the finger is still down.
  if (!drag && Math.abs(velocity) < 35 && audioBusy) silence();
  drawLights(now); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
